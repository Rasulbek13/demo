    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "QADAM LAB",
        "description": "QADAM LAB is a fictional EdTech portfolio demo project for English and IELTS learning in Uzbekistan.",
        "inLanguage": ["uz", "ru", "en"],
        "sameAs": [
          "https://www.instagram.com/qadamlab_edu/",
          "https://t.me/QadamLab_edu"
        ]
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('qadamlab_theme');
          var prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = stored === 'dark' || stored === 'light'
            ? stored
            : prefersDark
              ? 'dark'
              : 'light';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          var lang = localStorage.getItem('qadamlab_lang');
          if (lang === 'uz' || lang === 'ru' || lang === 'en') {
            document.documentElement.lang = lang;
          }
        } catch (_) {}
      })();
    </script>
